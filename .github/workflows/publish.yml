name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - run: cargo test
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cursor-bridge-linux
          path: target/release/cursor-bridge

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - run: cargo test --target x86_64-pc-windows-msvc
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cursor-bridge-windows
          path: target/x86_64-pc-windows-msvc/release/cursor-bridge.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cursor-bridge-linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: cursor-bridge-windows
          path: artifacts/windows
      - name: Prepare Linux asset
        run: chmod +x artifacts/linux/cursor-bridge
      - name: Create Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/linux/cursor-bridge \
            artifacts/windows/cursor-bridge.exe
        env:
          GH_TOKEN: ${{ github.token }}
